name: Release Android artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Read app version
        id: version
        shell: bash
        run: |
          app_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts)"
          test -n "$app_version"
          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$app_version" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        env:
          EXPECTED_TAG: ${{ steps.version.outputs.tag }}
        run: |
          test "$RELEASE_TAG" = "$EXPECTED_TAG"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build release artifacts
        run: ./gradlew test assembleRelease bundleRelease --no-daemon

      - name: Verify release signatures
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Prepare release assets
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "simple-nextcloud-$APP_VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "simple-nextcloud-$APP_VERSION.aab"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "simple-nextcloud-$APP_VERSION.aab" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "simple-nextcloud-$APP_VERSION.apk" \
              "simple-nextcloud-$APP_VERSION.aab" \
              --title "Simple Nextcloud $APP_VERSION" \
              --generate-notes
          fi
